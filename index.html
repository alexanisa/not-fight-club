<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./fight.png" type="image/png">
    <title>Not Fight Club</title>
</head>
<body>
    <section class="registration-screen" id="registration-screen">
        <h1 class="registration-screen__title">Not Fight Club</h1>
        <p class="registration-screen__subtitle">Enter character name</p>
        <input type="text" id="player-name-input" placeholder="Your name...">
        <button type="submit" id="register-button">Start game</button>
    </section>
    <div id="app">
        <section id="main-screen">
            <nav class="main-nav">
                <button class="nav-btn" data-screen="main">&#127968; Home</button>
                <button class="nav-btn" data-screen="character">&#128100; Character</button>
                <button class="nav-btn" data-screen="settings">&#9881;&#65039; Settings</button>
            </nav>
            <h2>Welcome, <span id="player-name-display"></span>!</h2>
            <button id="start-fight-btn">Start</button>
            <button id="reset-btn">Reset Progress</button>
        </section>

        <section id="character-screen">
            <nav class="main-nav">
                <button class="nav-btn" data-screen="main">&#127968; Home</button>
                <button class="nav-btn active" data-screen="character">&#128100; Character</button>
                <button class="nav-btn" data-screen="settings">&#9881;&#65039; Settings</button>
            </nav>
            <h2>Character</h2>
            <div id="avatar-container">
                <img id="player-avatar" src="./avatars/avatar1.png" alt="Avatar">
            </div>
            <p id="character-name-display"></p>
            <p>Wins: <span id="wins-display">0</span> | Losses: <span id="losses-display">0</span></p>

            <div id="wins-stats">
                <h3>&#127942; Wins per enemy</h3>
                <ul id="wins-list"></ul>
            </div>

            <div id="avatar-selection">
                <button class="avatar-btn" data-avatar="./avatars/avatar1.png">1</button>
                <button class="avatar-btn" data-avatar="./avatars/avatar2.png">2</button>
                <button class="avatar-btn" data-avatar="./avatars/avatar3.png">3</button>
            </div>
            <button id="back-to-main-from-character">&lArr; Back</button>
        </section>

        <section id="settings-screen">
            <nav class="main-nav">
                <button class="nav-btn" data-screen="main">&#127968; Home</button>
                <button class="nav-btn" data-screen="character">&#128100; Character</button>
                <button class="nav-btn active" data-screen="settings">&#9881;&#65039; Settings</button>
            </nav>
            <h2>Settings</h2>
            <p class="settings-label">Player name:</p>
            <p class="settings-current-name" id="settings-current-name-display"></p>
            <p class="settings-label">Change your name:</p>
            <input type="text" id="settings-name-input" placeholder="Enter new name...">
            <button class="save-btn">Save</button>
            <button class="back-btn">&lArr; Back</button>
        </section>

        <section id="battle-screen">
            <nav class="main-nav">
                <button class="nav-btn" data-screen="main">&#127968; Home</button>
                <button class="nav-btn" data-screen="character">&#128100; Character</button>
                <button class="nav-btn active" data-screen="settings">&#9881;&#65039; Settings</button>
            </nav>
            <button id="back-to-main-from-battle">&lArr; Back</button>
            <h2>&#x2694; Battle</h2>
            <div id="battle-container">
                <div id="enemy-battle">
                    <img id="enemy-avatar" src="" alt="Enemy Avatar">
                    <p id="battle-enemy-name"></p>
                    <div class="health-bar">
                        <div id="enemy-health"></div>
                    </div>
                    <span id="enemy-health-text">100 / 100</span>
                </div>
                <div id="player-battle">
                    <img id="battle-avatar" src="./avatars/avatar1.png" alt="Player Avatar">
                    <p id="battle-player-name"></p>
                    <div class="health-bar">
                        <div id="player-health"></div>
                    </div>
                    <span id="player-health-text">100 / 100</span>
                </div>
                <button id="super-attack-btn">&#128165; Super Attack!</button>
            </div>
            <div id="zone-selection">
                <div>
                    <h3>Attack</h3>
                    <button class="attack-zone" data-zone="head">Head</button>
                    <button class="attack-zone" data-zone="body">Body</button>
                    <button class="attack-zone" data-zone="legs">Legs</button>
                </div>
                <div>
                    <h3>Defense</h3>
                    <button class="defense-zone" data-zone="head">Head</button>
                    <button class="defense-zone" data-zone="body">Body</button>
                    <button class="defense-zone" data-zone="legs">Legs</button>
                </div>
            </div>

            <button id="fight-btn" disabled>&#x2694; Fight!</button>
            <div id="battle-hint">
                Choose 1 zone to attack and 2 zones to defend
            </div>

            <div id="battle-log">
                <h3>Battle Log</h3>
                <div id="log-entries"></div>
            </div>
        </section>
    </div>
    <div id="battle-result">
            <h2 id="result-title"></h2>
            <img id="result-image" src="" alt="Result">
            <button id="result-btn">Reset</button>
        </div>
    <script type="module" src="./app.js"></script>
    <script type="module" src="./fight.js"></script>
    <script type="module" src="./log.js"></script>
</body>
</html>
